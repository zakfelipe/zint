name: Build Zint ARM64 libraries

on:
  workflow_dispatch:

jobs:

  linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Zint
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpng-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DZINT_SHARED=ON \
            -DZINT_STATIC=OFF \
            -DZINT_USE_QT=OFF

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Show architecture
        run: |
          file build/backend/libzint.so

      - name: Upload Linux ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: zint-linux-arm64
          path: |
            build/backend/libzint.so*

  windows-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout Zint
        uses: actions/checkout@v4

      - name: Install libpng for ARM64
        shell: pwsh
        run: |
          vcpkg install libpng:arm64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A ARM64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=arm64-windows `
            -DZINT_SHARED=ON `
            -DZINT_STATIC=OFF `
            -DZINT_USE_QT=OFF `
            -DZINT_USE_PNG=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Upload Windows ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: zint-windows-arm64
          path: build/**/zint.dll
          if-no-files-found: error
